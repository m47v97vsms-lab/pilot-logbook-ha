name: Validate Home Assistant app repository

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ruff PyYAML
      - name: Lint and compile
        run: |
          ruff check --select F63,F7,F82 pilot_logbook_engine
          python -m compileall -q pilot_logbook_engine
      - name: Validate Supervisor metadata and bundled data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          app = Path("pilot_logbook_engine")
          config = yaml.safe_load((app / "config.yaml").read_text())
          repository = yaml.safe_load(Path("repository.yaml").read_text())
          assert config["name"] == "Pilot Logbook"
          assert config["slug"] == "pilot_logbook_engine"
          assert config["version"].startswith("0.4.0-dev")
          assert config["startup"] == "application"
          assert config["boot"] == "auto"
          assert config["ingress"] is True
          assert config["ingress_port"] == 8101
          assert "ports" not in config
          assert set(config["options"]) == set(config["schema"])
          assert repository["name"] == "Pilot Logbook"
          assert repository["url"].endswith("/pilot-logbook-ha")
          json.loads((app / "logten_airports.json").read_text())
          print("Supervisor metadata and bundled airport data are valid.")
          PY
      - name: Build Home Assistant app image
        run: |
          BUILD_VERSION="$(python -c 'import yaml; print(yaml.safe_load(open("pilot_logbook_engine/config.yaml", encoding="utf-8"))["version"])')"
          docker build --pull --build-arg BUILD_VERSION="$BUILD_VERSION" --build-arg BUILD_ARCH=amd64 -t pilot-logbook:ci ./pilot_logbook_engine

      - name: Smoke-test container startup and Ingress guard
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/pilot-logbook-container-data"
          body="$RUNNER_TEMP/pilot-logbook-container-health.json"
          container_name="pilot-logbook-ci-$GITHUB_RUN_ID"
          mkdir -p "$data_dir"
          docker run -d --name "$container_name" \
            -p 127.0.0.1:18101:8101 \
            -v "$data_dir:/data" \
            pilot-logbook:ci
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          code=""
          for attempt in $(seq 1 30); do
            code="$(curl --silent --output "$body" --write-out '%{http_code}' \
              http://127.0.0.1:18101/health || true)"
            if [ "$code" = "403" ]; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -q true; then
              docker logs "$container_name"
              echo "::error::Pilot Logbook container exited before serving HTTP."
              exit 1
            fi
            sleep 1
          done
          if [ "$code" != "403" ]; then
            docker logs "$container_name"
            echo "::error::Container did not return the expected Ingress-only 403 response."
            exit 1
          fi
          grep -q 'ingress_proxy_only' "$body"
          echo "Container image started successfully and rejected direct non-Ingress access."
